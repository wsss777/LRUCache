syntax = "proto3";
    package pb;
    option go_package = "github.com/wsss777/LRUCache/pb;pb";

    message Request{
      string group = 1;
      string key = 2;
      bytes value = 3;
      int64 expire_at_unix_nano = 4;
    }

    message ResponseForGet{
      bytes value = 1;
      int64 expire_at_unix_nano = 2;
    }

    message ResponseForDelete{
      bool value = 1;
    }

    service wsCache{
      rpc Get(Request) returns (ResponseForGet);
      rpc Set(Request) returns (ResponseForGet);
      rpc Delete(Request) returns (ResponseForDelete);
    }
